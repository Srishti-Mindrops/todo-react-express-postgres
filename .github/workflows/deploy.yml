
name: Secure CI/CD Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  security:
    name: Security Scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.18.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check production dependencies
        run: pnpm audit --prod

      - name: Scan for exposed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan source code
        run: |
          pipx run semgrep scan --config auto --error .

      - name: Scan dependencies and configuration
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Scan GitHub Actions workflows
        uses: zizmorcore/zizmor-action@v1

  deploy:
    name: Deploy to EC2
    needs: security
    runs-on: [self-hosted, linux, x64, todo-app]

    steps:
      - name: Deploy application
        shell: bash
        run: |
          set -euo pipefail

          cd /home/ubuntu/todo-react-express-postgres

          git pull --ff-only origin main

          pnpm install --frozen-lockfile

          pnpm run build

          pm2 restart todo-backend --update-env

          echo "Deployment completed successfully!"
