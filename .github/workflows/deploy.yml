
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.18.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

  deploy:
    name: Deploy to EC2
    needs: verify
    runs-on: [self-hosted, linux, x64, todo-app]
    steps:
      - name: Deploy application
        shell: bash
        run: |
          set -euo pipefail

          cd /home/ubuntu/todo-react-express-postgres

          git pull --ff-only origin main
          pnpm install --frozen-lockfile
          pnpm run build

          find /var/www/todo-app -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          cp -a frontend/dist/. /var/www/todo-app/

          pm2 restart todo-backend --update-env

          for attempt in {1..15}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1/api/todos >/dev/null; then
              echo "Health check passed!"
              break
            fi

            echo "Backend not ready yet. Retrying in 2 seconds..."
            sleep 2
          done

          if [ "$attempt" -eq 15 ]; then
            echo "Health check failed after 15 attempts!"
            exit 1
          fi

          echo "Deployment completed successfully!"
